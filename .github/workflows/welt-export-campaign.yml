name: Welt full export campaign

on:
  workflow_dispatch:
    inputs:
      baseline_ref:
        description: Revision before the Resources candidate cache
        required: true
        type: string
        default: 12dd94c
      candidate_ref:
        description: Revision to measure
        required: true
        type: string
        default: dev-oesphy

permissions:
  contents: read

jobs:
  compare:
    name: Alternating full-world export, memory and NBT parity
    runs-on: windows-latest
    steps:
      - name: Set up Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Check out baseline
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.baseline_ref }}
          path: baseline

      - name: Configure the Maven JDK 17 toolchain
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path (Join-Path $HOME '.m2') | Out-Null
          $toolchains = '<toolchains><toolchain><type>jdk</type><provides><version>17</version></provides><configuration><jdkHome>' + $env:JAVA_HOME + '</jdkHome></configuration></toolchain></toolchains>'
          Set-Content -Path (Join-Path $HOME '.m2/toolchains.xml') -Value $toolchains -Encoding utf8

      - name: Measure baseline full-world exports
        working-directory: baseline/WorldPainter
        run: >-
          mvn --batch-mode --no-transfer-progress -Pnative -pl WPCore -am
          -Dtest=ExportFullWorldCampaignTest
          -Dsurefire.failIfNoSpecifiedTests=false
          -Dwelt.export.campaign=true
          -Dwelt.export.modernChunkCampaign=true
          test

      - name: Upload baseline measurements
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: welt-export-campaign-baseline
          path: baseline/WorldPainter/WPCore/target/surefire-reports/*ExportFullWorldCampaignTest*
          if-no-files-found: warn

      - name: Check out candidate
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.candidate_ref }}
          path: candidate

      - name: Measure candidate full-world exports
        working-directory: candidate/WorldPainter
        run: >-
          mvn --batch-mode --no-transfer-progress -Pnative -pl WPCore -am
          -Dtest=ExportFullWorldCampaignTest
          -Dsurefire.failIfNoSpecifiedTests=false
          -Dwelt.export.campaign=true
          -Dwelt.export.modernChunkCampaign=true
          test

      - name: Upload candidate measurements
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: welt-export-campaign-candidate
          path: candidate/WorldPainter/WPCore/target/surefire-reports/*ExportFullWorldCampaignTest*
          if-no-files-found: warn
